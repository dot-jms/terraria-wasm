<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/app.webp" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta property="og:title" content="Terrarium" />
		<meta
			property="og:description"
			content="Terraria port for WebAssembly. Play Terraria online in the browser."
		/>
		<meta
			name="description"
			content="Terraria port for WebAssembly. Play Terraria online in the browser."
		/>
		<link rel="canonical" href="https://terraria.mercurywork.shop" />

		<link rel="preload" href="/logo.webp" as="image" />

		<% if (process.env.VITE_SIMPLE_DOWNLOAD) { %>
		<meta name="robots" content="noindex, nofollow" />
		<% } %>
		<title>Terrarium</title>
	</head>

	<body>
		<div id="app"></div>
		<script>
			// Static hosts such as GitHub Pages cannot emit COOP/COEP headers.
			// Install the worker before loading the app; on the first visit it
			// claims the page and reloads so the app starts isolated.
			if (!crossOriginIsolated && "serviceWorker" in navigator) {
				navigator.serviceWorker
					.register(new URL("./coi-serviceworker.js", document.baseURI), {
						scope: new URL("./", document.baseURI).pathname,
					})
					.then((registration) => {
						if (registration.active && !navigator.serviceWorker.controller) {
							location.reload();
						}
					})
					.catch((error) =>
						console.error("Unable to enable cross-origin isolation", error),
					);
			}
		</script>
		<script type="module" src="/src/app.tsx"></script>
	</body>
</html>
