name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download Terraria WASM build
        run: |
          wget https://github.com/MercuryWorkshop/terraria-wasm/releases/download/1.0/terraria-wasm-build.zip
          unzip terraria-wasm-build.zip -d prebuilt

      - name: Copy WASM files
        run: |
          cp -r prebuilt/_framework public/_framework
          cp prebuilt/sw.js public/sw.js

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_PATH: /terraria-wasm/
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
